# ---------------------------------------------------------------
#  BlackCloverSMP configuration
#  Every number in the design lives here. Use /bcadmin reload after editing.
# ---------------------------------------------------------------

progression:
  level-cap: 20
  # XP to go from level L to L+1 = xp-base + xp-step * (L - 1)
  xp-base: 100
  xp-step: 25

kills:
  base-xp: 100
  # +10% per level the victim is above you, -10% per level below
  bonus-per-level: 0.10
  max-bonus: 1.0
  min-factor: 0.20
  # No XP for killing the same player again within this many minutes
  repeat-kill-minutes: 10
  # Kill credit / combat tag window
  combat-tag-seconds: 15

death:
  # Fraction of XP on the carried grimoire lost on any death
  penalty-fraction: 0.15
  # The penalty can only hit once per this many minutes
  penalty-cooldown-minutes: 5
  # Quitting while combat-tagged kills the player
  combat-log-kills: true

mana:
  base: 100
  per-level: 4
  regen-per-second: 4
  five-leaf-multiplier: 1.5

libraries:
  min-distance-from-origin: 1000
  border-margin: 50
  min-spacing: 400
  # Ingredients needed at an altar to craft its grimoire
  recipe:
    BOOK: 1
    LAPIS_LAZULI: 16
    DIAMOND: 1

grimoires:
  # A grimoire returns to its library if its holder is offline this long
  offline-return-days: 7

demon:
  max-health: 40
  # How often the Demon Possessed's coordinates are announced
  broadcast-minutes: 5

# Magic Knight squads (/squad)
squads:
  max-members: 6
  # How long a squad invite stays open
  invite-minutes: 5
  # false: squadmates can't hurt each other with weapons or spells
  friendly-fire: false
  # Stars a squad earns
  stars:
    # a member kills a player from outside the squad (not a repeat kill)
    kill: 1
    # a member is chosen by a grimoire at a library
    grimoire: 3
    # a member kills the Demon Possessed
    demon: 5

# On-screen info. Turn parts off if another plugin already manages them.
hud:
  # Sidebar with grimoire, level, mana, kills, squad and stars. Players can hide it with /magic hud.
  sidebar: true
  # Tab list header/footer and names with level, squad colour and crown
  tab-list: true
  # Squad name above players' heads
  nametags: true
  # Squad tag, level and crown in chat
  chat-format: true
  # Last line of the sidebar (MiniMessage)
  footer: "<dark_gray>/magic  ·  /squad"

# The highest-level grimoire holder is crowned Wizard King (the Demon Possessed can't be)
wizard-king:
  min-level: 5

# Worlds where magic cannot be cast
disabled-worlds: []

# Custom 3D grimoires and spell models. Players without the pack still see normal items.
resource-pack:
  enabled: true
  # auto = use `url` if the file there matches this plugin's pack, otherwise serve it yourself on `port`
  # url  = always send `url` (upload plugins/BlackCloverSMP/BlackCloverSMP-pack.zip and link it directly)
  # self = always serve it yourself on `port` (that port must be open on your host)
  host: auto
  url: "https://raw.githubusercontent.com/soloyko/Infuse/yensake/gallant-franklin-geeef9/downloads/BlackCloverSMP-pack-${project.version}.zip"
  port: 8163
  # Address players download from when self-hosting. Empty = the address each player joined with.
  public-address: ""
  # true = players must accept the pack to stay on the server
  required: false
  prompt: "<green>Black Clover <gray>3D grimoires and magic"

# Per-spell cost / cooldown (seconds) / damage. Filled in automatically on first start.
spells: {}
