# ╔══════════════════════════════════════════════════════════╗
# ║                      OP SWORDS                           ║
# ║  10 legendary swords with 3D models and unique abilities ║
# ╚══════════════════════════════════════════════════════════╝
#
# Controls (while holding a sword):
#   Right-Click          -> primary ability
#   Sneak + Right-Click  -> secondary ability
#   Swap-hand key (F)    -> secondary ability too, if controls.swap-hand-secondary is on
#
# /opswords reload applies changes. Swords players already own update
# automatically the next time they hold them.

settings:
  # Swords never lose durability.
  unbreakable: true
  # Abilities can damage other players (PvP). World PvP settings and
  # protection plugins that cancel player damage are still respected.
  abilities-hit-players: true
  # Multiplies all ability damage (not normal melee damage).
  ability-damage-multiplier: 1.0
  # Extra multiplier for ability damage against players, on top of the one above.
  # Lower it if abilities feel too strong in PvP (e.g. 0.75).
  ability-damage-multiplier-vs-players: 1.0
  # Shows ability cooldowns on the action bar while a sword is held.
  action-bar-hud: true
  # Plays a chime when an ability comes off cooldown while you hold the sword.
  ability-ready-sound: true
  # Faint themed particles around a held sword (hidden while invisible).
  held-aura: true
  # Custom death messages for kills with an OP sword, e.g. "Steve was frozen solid by Alex".
  death-messages: true
  # Dropped OP swords never despawn, can't be destroyed and glow.
  protect-dropped-swords: true
  # Abilities do nothing in these worlds.
  disabled-worlds: []

controls:
  # Pressing the swap-hand key (F) with a sword fires its secondary ability instead of
  # swapping hands. Sneak + Right-Click keeps working either way.
  swap-hand-secondary: false

resource-pack:
  # self-host: the plugin serves the bundled pack from a small built-in web server.
  # url:       send the pack from your own link (for example a merged server pack).
  # none:      don't send anything (you handle the pack yourself).
  mode: self-host
  # true = players must accept the pack or they're disconnected.
  required: false
  # Shown on the download prompt. MiniMessage format.
  prompt: "<gradient:#ECBA44:#C4415B><bold>OP Swords</bold></gradient> <gray>uses a resource pack for its 3D sword models."
  self-host:
    # This port must be open to players (TCP). On a shared host, use an extra port
    # your host gave you.
    port: 8163
    bind-address: "0.0.0.0"
    # Address players download the pack from. Leave blank to use the address each
    # player typed to join (works for most servers).
    public-address: ""
  url:
    link: ""
    # SHA-1 of the zip. Leave blank and the plugin downloads the pack once on
    # startup to work it out.
    sha1: ""

crafting:
  enabled: true
  # Broadcasts a message when someone forges an OP sword.
  announce: true
  # Legendary mode: each sword can only be crafted once per server. Admins can still
  # /opswords give, and /opswords unforge <sword> allows it to be crafted again.
  unique-swords: false

# Per-sword settings.
#   attack-damage / attack-speed : melee stats (netherite sword is 8 / 1.6)
#   cooldowns                    : seconds
#   recipe                       : shaped crafting recipe; S is always a netherite sword in the defaults
