    fireball-cooldown-ticks: 30
    teleport-range: 15
    curse-seconds: 10
    kill-bosses: false
  feather:
    launch-velocity: 2.2
    slam-damage: 12
    wind-charge-speed: 1.6
    wind-charge-cooldown-ticks: 5
  fire:
    spark-radius: 5
    spark-fire-ticks: 100
    lava-swim-speed: 0.35
  frost:
    jump-reduction: 0.5
    snow-swim-speed: 0.3
  haste:
    fortune-level: 5
    unbreaking-level: 10
    spark-attack-speed: 4
  heart:
    bonus-health: 10
    max-absorption: 40
    food-absorption: 4
    egap-absorption: 20
    spark-heal-to: 40
    spark-heal-radius: 8
  invisibility:
    blind-ticks: 100
    ring-radius: 2.5
  ocean:
    drown-radius: 6
    drown-only-in-water: true
    air-drain-per-second: 60
    trident-pull: 1.6
    whirlhole-range: 20
    whirlhole-radius: 7
    whirlhole-pull: 0.35
  regeneration:
    saturation-bonus: 3
    lifesteal-percent: 30
  speed:
    max-stacks: 3
    stack-reset-seconds: 3
    dash-velocity: 2.2
  strength:
    shield-disable-ticks: 200
  thunder:
    spark-radius: 10
    storm-seconds: 60
    chain-targets: 3
    chain-radius: 6
    chain-damage: 4
  thief:
    backstab-bonus-percent: 50
    silence-seconds: 8
    steal-max-seconds: 30
  weaving:
    trap-seconds: 3
    arrow-web-seconds: 3
    snare-radius: 6
  oozing:
    knockback-reduction: 0.15
    max-bounce: 1.3
    slime-seconds: 5
    slime-threshold-hearts: 4
    slime-cooldown-seconds: 60
    slime-count: 2
    slime-size: 2
    slime-lifetime-seconds: 20
    jump-boost: 2
    slam-damage: 8
    splash-radius: 3
  resistance:
