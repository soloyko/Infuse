# ╔══════════════════════════════════════════════════════════╗
# ║                       CUSTOMS                            ║
# ║   45 legendary weapons in five arcs, with 3D models,     ║
# ║   unique abilities and weapon altars                     ║
# ╚══════════════════════════════════════════════════════════╝
#
# Controls (while holding a weapon, see controls.trigger):
#   Swap-hand key (F)          -> first ability
#   Sneak + swap-hand key (F)  -> second ability
#
# /customs reload applies changes. Weapons players already own update
# automatically the next time they hold them.

# Used to upgrade older configs. Don't change it.
config-version: 3

settings:
  # Swords never lose durability.
  unbreakable: true
  # Abilities can damage other players (PvP). World PvP settings and
  # protection plugins that cancel player damage are still respected.
  abilities-hit-players: true
  # Multiplies all ability damage (not normal melee damage).
  ability-damage-multiplier: 1.0
  # Extra multiplier for ability damage against players, on top of the one above.
  # Lower it if abilities feel too strong in PvP (e.g. 0.75).
  ability-damage-multiplier-vs-players: 1.0
  # Shows ability cooldowns on the action bar while a weapon is held.
  action-bar-hud: true
  # Plays a chime when an ability comes off cooldown while you hold the weapon.
  ability-ready-sound: true
  # Faint themed particles around a held weapon (hidden while invisible).
  held-aura: true
  # A glowing slash in the weapon's colour on every melee hit.
  melee-slashes: true
  # Using an ability shows the weapon's element: flames, frost, sparks, splashes, leaves,
  # runes, shadow, blood or a sweep of wind.
  cast-circles: true
  # Kills with a weapon end in a burst of light in the weapon's colour.
  kill-effects: true
  # Damage numbers pop out of anything a weapon hits: gold for critical swings, the weapon's
  # colour for abilities. Rapid hits on one target add up on a single number.
  damage-numbers: true
  # Custom death messages for kills with a weapon, e.g. "Steve was frozen solid by Alex".
  death-messages: true
  # Dropped weapons never despawn, can't be destroyed and glow.
  protect-dropped-swords: true
  # Abilities do nothing in these worlds.
  disabled-worlds: []

controls:
  # How abilities are fired while holding a weapon:
  #   offhand     - swap-hand key (F by default) = first ability, Sneak + F = second ability.
  #                 Right-click keeps its normal use. Tooltips show each player's own key.
  #   right-click - Right-Click = first ability, Sneak + Right-Click = second ability
  #   both        - either works
  trigger: offhand

resource-pack:
  # self-host: the plugin serves the bundled pack from a small built-in web server.
  # url:       send the pack from your own link (for example a merged server pack).
  # none:      don't send anything (you handle the pack yourself).
  mode: self-host
  # true = players must accept the pack or they're disconnected.
  required: false
  # Shown on the download prompt. MiniMessage format.
  prompt: "<gradient:#ECBA44:#C4415B><bold>Customs</bold></gradient> <gray>uses a resource pack for its 3D weapon models."
  self-host:
    # This port must be open to players (TCP). On a shared host, use an extra port
    # your host gave you.
    port: 8163
    bind-address: "0.0.0.0"
    # Address players download the pack from. Leave blank to use the address each
    # player typed to join (works for most servers).
    public-address: ""
  url:
    link: ""
    # SHA-1 of the zip. Leave blank and the plugin downloads the pack once on
    # startup to work it out.
    sha1: ""

crafting:
  enabled: true
  # Broadcasts a message when someone forges a weapon.
  announce: true
  # Legendary mode: each weapon can only be crafted (or forged at an altar) once per server,
  # so there is only ever one of each. Admins can still /customs give, and
  # /customs unforge <weapon> allows it to be crafted again. Set to false to allow copies.
  unique-swords: true
  # Weapons can be crafted in a crafting table. Set to false to make weapon altars the only
  # way to forge them.
  crafting-table: true

altars:
  # Weapon altars: one-block 3D altars that only admins can place (/customs altar give).
  # Each one holds a weapon, with its recipe circling above it. Players forge that weapon by
  # right-clicking the altar with the ingredients in their inventory.
  enabled: true

arcs:
  # The server's arcs. An admin starts Arc I with /customs arc start and moves on with
  # /customs arc next, up to Arc V. Each arc unlocks its nine weapons for forging (earlier arcs
  # stay unlocked; later ones are locked) and brings a twist for the whole server:
  #   I   Awakening  - Grace of Dawn: no PvP; some monsters spawn Awakened and drop materials
  #   II  Ascension  - Featherfall: lighter gravity, half fall damage, cooldowns 25% shorter
  #   III Dominion   - Spoils of War: weapon carriers glow; killers take their victims' weapons
  #   IV  Cataclysm  - Meteor Storms: meteors around players every few minutes; monsters hit harder
  #   V   Eternity   - Endless Night: the sun never rises; a killing blow revives you once every 10 min
  # While no arc is running, every weapon can be forged and there are no twists.
  # Show the current arc and its twist in a bar at the top of the screen.
  boss-bar: true
  # Turn single twists off (the arc still unlocks its weapons).
  twists:
    awakening: true
    ascension: true
    dominion: true
    cataclysm: true
    eternity: true
  # Cataclysm: minutes between meteor storms, and whether meteors also fall on creative players.
  meteor-interval-minutes: 4
  meteors-hit-creative: false
  # Eternity: minutes between two revivals for the same player.
  eternal-grace-minutes: 10

