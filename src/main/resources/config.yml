# Infuse configuration. Times are in seconds unless stated otherwise.
# All chat/title/bossbar text lives in messages.yml. Run /infuse reload after editing.

style:
  # Effect names like "ᴀᴜɢᴍᴇɴᴛᴇᴅ ᴛʜɪᴇꜰ ᴇꜰꜰᴇᴄᴛ"
  small-caps: true
  # Effect names fade from the effect's colour to a lighter shade
  gradients: true
  gradient-lighten: 0.55

visuals:
  # Soft particles at your feet in the colour of each equipped effect
  passive-aura: true
  # Augmented effects add an orbiting wisp
  augmented-orbit: true
  # Signature particles while a spark is active (crimson spores for Strength, snowflakes for Frost, ...)
  spark-aura: true
  # Dropped effect bottles show their name above them (augmented ones glow)
  dropped-bottle-names: true

gui:
  # /infuses opens the effects menu (false = list them in chat instead)
  infuses-opens-menu: true

allies:
  # team = players on the same scoreboard team are allies (for Heart/Invisibility/Thief etc.)
  # none = everyone else is an enemy
  mode: team

resource-pack:
  # Direct download link to InfusePack.zip (e.g. a GitHub release asset). Leave empty to not send a pack.
  url: ""
  # Optional SHA-1 of the zip (40 hex characters) so clients cache it.
  sha1: ""
  required: false
  prompt: "<light_purple>Infuse needs its resource pack to show effect icons."

brewing:
  # Right-clicking a brewing stand opens a crafting table instead. Set to false to re-enable brewing.
  replace-with-crafting: true

crafting:
  # Effects can only be crafted from a brewing stand's crafting table (only when replace-with-crafting is on).
  require-brewing-stand: true
  # Total crafts allowed per effect (-1 = unlimited).
  max-crafts: 4
  # How many of the first crafts are augmented. Each augmented craft starts a ritual.
  augmented-crafts: 1
  # Per-effect overrides, e.g.  ender: 2   or   thief: -1
  per-effect-max: {}
  per-effect-augmented: {}
  broadcast-coordinates: true

ritual:
  duration-seconds: 600
  # Per-effect overrides, e.g.  apophis: 900
  per-effect-seconds: {}
  bossbar: true
  # Spinning augmented bottle and countdown floating above the brewing stand
  hologram: true

sparks:
  # Worlds where sparks can't be used (passives still work), e.g. [world_nether, spawn]
  disabled-worlds: []

controls:
  # New players start with Offhand controls (F = primary spark, Sneak + F = secondary spark).
  default-offhand: true

death:
  drop-effect: true
  # primary-first (primary drops, or secondary if there is no primary), secondary-first, random, both, none
  drop-mode: primary-first
  # Only drop effects when killed by another player
  only-when-killed-by-player: false

hud:
  enabled: true
  update-ticks: 4
  # Spaces used for <gap> below.
  spacing: 2
  hit-tracker: true
  # Action bar layout (MiniMessage). Placeholders: <left> <right> <hits> <gap>
  format: "<left><gap><hits><gap><right>"

# Spark cooldowns for regular effects. Augmented effects use cooldown x augmented-multiplier.
cooldowns:
  augmented-multiplier: 0.5
  emerald: 60
  ender: 60
  feather: 60
  fire: 60
  frost: 60
  haste: 60
  heart: 60
  invisibility: 60
  ocean: 60
  regeneration: 60
  speed: 60
  strength: 60
  thunder: 60
  apophis: 60
  thief: 60
  weaving: 60
  oozing: 60
  resistance: 60

# How long sparks stay active.
durations:
  emerald: 30
  ender: 10
  feather: 12
  frost: 15
  haste: 15
  invisibility: 10
  ocean: 6
  regeneration: 15
  strength: 15
  apophis: 15
  thief: 15
  weaving: 3
  oozing: 8
  resistance: 5

# Every effect also accepts:
#   enabled: false                 -> can't be crafted, equipped or used
#   display-name: "Rogue"           -> rename it everywhere
#   extra-potions: ["NIGHT_VISION:0"] -> extra potion effects (NAME:amplifier) while equipped
effects:
  emerald:
    looting-level: 5
    exp-multiplier: 1.5
    spark-exp-multiplier: 3.0
    enchant-levels: [10, 20, 30]
  ender:
