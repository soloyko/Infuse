# All player-facing text, in MiniMessage format: https://docs.advntr.dev/minimessage/format
prefix: "<dark_gray>[<gradient:#ff1f3d:#8b0000>Bloodbound</gradient>]</dark_gray> "

no-permission: "<prefix><red>You don't have permission to do that."
players-only: "<prefix><red>Only players can do that."
unknown-player: "<prefix><red>No Bloodbound data for <white><player></white>."
invalid-duration: "<prefix><red>Invalid duration <white><input></white>. Use something like <white>30s</white>, <white>10m</white> or <white>1h30m</white>."
reloaded: "<prefix><green>Configuration and messages reloaded."

session:
  started: "<prefix><red>A session has begun!</red> <gray>Altars are awake. Fight, grind, forge.</gray>"
  started-timed: "<prefix><red>A session has begun!</red> <gray>Ends in <white><time></white>.</gray>"
  ended: "<prefix><gray>The session has ended. Altars fall dormant.</gray>"
  already-active: "<prefix><red>A session is already running."
  not-active: "<prefix><red>No session is running."
  status-active: "<prefix><gray>Session <green>active</green>. Remaining: <white><time></white>. Event: <white><event></white>."
  status-inactive: "<prefix><gray>No session running."
  title: "<gradient:#ff1f3d:#8b0000><bold>SESSION BEGINS</bold></gradient>"
  subtitle: "<gray>Altars are awake</gray>"
  end-title: "<gray><bold>SESSION OVER</bold></gray>"
  end-subtitle: "<dark_gray>Rest, for now</dark_gray>"
  bossbar: "<red><bold>Session</bold></red> <gray><time></gray><event>"
  bossbar-open: "running"
  bossbar-event: " <dark_gray>|</dark_gray> <event>"

event:
  started: "<prefix><white><event></white> <gray>has begun! <description>"
  ended: "<prefix><white><event></white> <gray>has ended."
  needs-session: "<prefix><red>Start a session first."
  unknown: "<prefix><red>Unknown event <white><input></white>. Try: <white><list></white>"
  none-active: "<prefix><red>No event is running."
  list: "<prefix><gray>Events: <white><list></white>"
  no-bounty-target: "<prefix><red>Nobody online can hold the bounty."
  bounty-ping: "<prefix><gold>☠ Bounty</gold> <white><player></white> <gray>is at</gray> <white><x>, <y>, <z></white> <gray>in <world>.</gray>"
  bounty-moved: "<prefix><gold>☠</gold> <white><player></white> <gray>now holds the bounty!"
  bounty-claimed: "<prefix><gold>☠</gold> <white><killer></white> <gray>claimed the bounty on</gray> <white><player></white> <gray>and inherits it!"
  names:
    blood_moon: "<dark_red>Blood Moon</dark_red>"
    bounty: "<gold>Bounty</gold>"
    frenzy: "<light_purple>Frenzy</light_purple>"
    last_stand: "<gray>Last Stand</gray>"
    altar_surge: "<red>Altar Surge</red>"
  descriptions:
    blood_moon: "All blood gains are doubled."
    bounty: "Kill the marked player for a huge reward. The bounty passes to whoever claims it."
    frenzy: "Ability cooldowns are halved."
    last_stand: "No natural regeneration. Kills fully heal you."
    altar_surge: "Stand near an altar to soak up blood. Hold the ground."

altar:
  item-name: "<gradient:#ff1f3d:#8b0000>Bloodbound Altar</gradient>"
  item-lore:
    - "<gray>Place to create an altar where"
    - "<gray>players forge Bloodbound weapons."
    - "<dark_gray>Admin only"
  placed: "<prefix><green>Altar created at <white><x>, <y>, <z></white>."
  removed: "<prefix><yellow>Altar removed at <white><x>, <y>, <z></white>."
  admin-only: "<prefix><red>Only admins can place or break altars."
  dormant: "<prefix><gray>The altar is dormant. It only awakens during a session."
  given: "<prefix><green>You received an altar."
  none-nearby: "<prefix><red>No altar within 5 blocks."
  list-header: "<prefix><gray>Altars (<white><count></white>):"
  list-entry: "<dark_gray> - <white><world></white> <gray><x>, <y>, <z>"
  menu-title: "<dark_red>Bloodbound Altar"
  forged: "<prefix><green>You forged a <weapon><green>!"
  forged-broadcast: "<prefix><white><player></white> <gray>forged a</gray> <weapon><gray>.</gray>"
  already-owns: "<prefix><red>You already carry your <weapon><red>."
  missing-items: "<prefix><red>You're missing ingredients for the <weapon><red>."
  menu-cost: "<gray>Cost:"
  menu-cost-line: "<dark_gray> <mark> <white><amount>x</white> <gray><item>"
  menu-have: "<green>✔"
  menu-missing: "<red>✘"
  menu-click-forge: "<yellow>Click to forge"
  menu-click-recraft: "<yellow>Click to reforge <gray>(old copies break, progress kept)"
  menu-owned: "<green>You carry this weapon"
  menu-stats-name: "<white>Your blood"
  menu-stats-lore:
    - "<gray>Weapon: <white><weapon>"
    - "<gray>Tier: <white><tier></white><dark_gray>/<max>"
    - "<gray>Blood: <red><blood>"

weapon:
  lore-tier: "<gray>Tier <white><tier></white><dark_gray>/<max></dark_gray> <dark_gray>•</dark_gray> <red><blood> blood"
  lore-passive: "<gray>Passive: <white><name></white>"
  lore-active: "<gray>[F] <white><name></white> <dark_gray>(tier <tier>)"
  lore-ultimate: "<gray>[Sneak+F] <white><name></white> <dark_gray>(tier <tier>)"
  lore-owner: "<dark_gray>Bound to <owner>"
  lore-session: "<dark_gray>Powers awaken only during sessions"
  not-yours: "<prefix><red>This weapon is bound to someone else."
  locked: "<prefix><gray><ability> unlocks at tier <white><tier></white>."
  cooldown: "<prefix><gray><ability> is ready in <white><seconds>s</white>."
  actionbar-ready: "<green><ability> ✔"
  actionbar-cooldown: "<red><ability> <seconds>s"
  actionbar-locked: "<dark_gray><ability> T<tier>"
  actionbar-separator: " <dark_gray>|</dark_gray> "
  types:
    crimson_blade:
      name: "<#ff2e4d>Crimson Blade"
      description: "<gray>Drinks the blood it spills."
      passive: "Lifesteal"
      active: "Blood Dash"
      ultimate: "Hemorrhage"
    ravager_axe:
      name: "<#ff8a2b>Ravager Axe"
      description: "<gray>Cleaves through armor and shields."
      passive: "Sunder"
      active: "Ground Slam"
      ultimate: "Berserk"
    tempest_trident:
      name: "<#3bc7ff>Tempest Trident"
      description: "<gray>Every fourth strike calls the storm."
      passive: "Stormcharge"
      active: "Gale"
      ultimate: "Maelstrom"
    earthshaker_mace:
      name: "<#b38b6d>Earthshaker Mace"
      description: "<gray>What goes up comes down hard."
      passive: "Tremor"
      active: "Skyward"
      ultimate: "Meteor"
    phantom_bow:
      name: "<#b18cff>Phantom Bow"
      description: "<gray>Arrows that hunt, and a step through shadow."
      passive: "Seeker"
      active: "Volley"
      ultimate: "Shadowstep"

blood:
  gained: "<red>+<amount> blood</red> <dark_gray><reason>"
  lost: "<prefix><gray>You lost <red><amount> blood</red>."
  tier-up-title: "<gradient:#ff1f3d:#8b0000><bold>TIER <tier></bold></gradient>"
  tier-up-subtitle: "<gray>Your weapon grows stronger"
  tier-down: "<prefix><gray>Your weapon shattered to tier <white><tier></white>."
  max-tier-broadcast: "<prefix><white><player></white> <gray>has reached</gray> <red><bold>max tier</bold></red><gray>!"
  shattered: "<prefix><gray>You shattered</gray> <white><player></white><gray>'s weapon: <red>+<amount></red> blood.</gray>"
  repeat-kill: "<prefix><gray>No blood: you killed <white><player></white> too recently."
  reason-kill: "kill"
  reason-mob: "mob"
  reason-bounty: "bounty"
  reason-surge: "altar surge"
  reason-survive: "surviving the bounty"
  set: "<prefix><green>Set <white><player></white>'s blood to <white><amount></white>."

stats:
  header: "<prefix><white><player></white>"
  weapon: "<gray>Weapon: <white><weapon>"
  no-weapon: "<gray>Weapon: <dark_gray>none yet"
  tier: "<gray>Tier: <white><tier></white><dark_gray>/<max>"
  blood: "<gray>Blood: <red><blood></red> <dark_gray>(<next>)"
  next: "<next> to next tier"
  maxed: "max tier"
  top-header: "<prefix><gray>Top blood:"
  top-entry: "<dark_gray><rank>.</dark_gray> <white><player></white> <gray>T<tier></gray> <red><blood>"
  top-empty: "<prefix><gray>Nobody has any blood yet."
