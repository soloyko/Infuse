name: BlackCloverSMP
version: '${project.version}'
main: dev.blackclover.smp.BlackCloverPlugin
api-version: '1.21'
description: Black Clover themed PvP SMP - unique grimoires, magic and the Demon Possessed.
commands:
  start:
    description: Start the Black Clover game (sets border, grace period, builds libraries).
    usage: /start <border size> <grace period>
    aliases: [bcstart]
    permission: blackclover.admin
permissions:
  blackclover.admin:
    description: Run /start and /bcadmin.
    default: op
